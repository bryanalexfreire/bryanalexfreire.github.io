name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Links, languages, layout and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the site checks (desktop and mobile)
        run: npx playwright test

      - name: Keep the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-checks-report
          path: playwright-report/
          retention-days: 14
